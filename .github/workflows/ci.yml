name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Verify package contents
        run: npm pack --dry-run

      # The publication gate has to run HERE, not only on the maintainer's
      # machine: `prepublishOnly` fires at `npm publish` time, which is the
      # last moment and only for whoever runs it. CI is the first moment.
      #
      # `DSH_STRICT_PRIVACY=1` turns a missing OCR backend from a silent SKIP
      # into a failure, so a runner without the traineddata cannot report a
      # green gate it did not actually check. The data is fetched into
      # `$RUNNER_TEMP` (never the repo root) and pointed at with DSH_TESSDATA.
      - name: Fetch OCR data for the image gate
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/tessdata"
          # `4.0.0`, NOT `4.0.0_best`. The `_best` variant is a different model
          # file and aborts tesseract.js 7 with
          #   Aborted(missing function: _ZN9tesseract13DotProductSSEEPKfS1_i)
          # which surfaces as a SKIP in verify-privacy.mjs — i.e. the gate would
          # report a hole rather than a pass, but only after install works. The
          # plain 4.0.0 file is the one tesseract.js fetches for itself and the
          # one measured to OCR these three images cleanly.
          curl -fsSL -o "$RUNNER_TEMP/tessdata/eng.traineddata.gz" \
            https://github.com/naptha/tessdata/raw/gh-pages/4.0.0/eng.traineddata.gz
          curl -fsSL -o "$RUNNER_TEMP/tessdata/chi_sim.traineddata.gz" \
            https://github.com/naptha/tessdata/raw/gh-pages/4.0.0/chi_sim.traineddata.gz

      - name: Privacy gate
        shell: bash
        env:
          DSH_TESSDATA: ${{ runner.temp }}/tessdata
          DSH_STRICT_PRIVACY: '1'
        run: pnpm run verify:privacy
